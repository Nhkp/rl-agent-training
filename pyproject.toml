[project]
name = "projet-11"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "gymnasium[box2d]>=1.3.0",
    "httpx2>=0.28.0",
    "imageio[ffmpeg]>=2.35.0",
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.0",
    "numpy>=2.4.6",
    "seaborn>=0.13.2",
    "stable-baselines3>=2.9.0",
    "streamlit>=1.38.0",
    "tensorboard>=2.20.0",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "coverage>=7.12.0",
    "coverage-badge>=1.1.2",
    "httpx>=0.28.0",
    "pytest>=9.0.0",
    "pytest-cov>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["src/projet_11"]
omit = [
    "src/projet_11/app.py",
]

[tool.coverage.report]
show_missing = true
skip_empty = true

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["projet_11*"]
