name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y swig

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run tests with coverage
        run: uv run pytest --cov=src/projet_11 --cov-report=term-missing --cov-report=xml --cov-fail-under=80

      - name: Generate coverage badge
        run: uv run coverage-badge -o coverage.svg -f

      - name: Ensure coverage badge is up to date
        run: git diff --exit-code coverage.svg
